<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Keuangan Cluster Titik Pulang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js untuk state management modern -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- SweetAlert2 untuk popup profesional -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body x-data="financeApp()" x-init="fetchData()" class="text-gray-800">

    <!-- Top Navigation -->
    <nav class="bg-indigo-900 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-wallet text-2xl text-indigo-400"></i>
                <span class="font-bold text-xl tracking-tight">Titik Pulang Finance</span>
            </div>
            <button x-show="!isAdmin" @click="showLogin = true" class="bg-indigo-700 hover:bg-indigo-600 px-4 py-2 rounded-md text-sm font-semibold transition">
                <i class="fa-solid fa-lock mr-2"></i>Admin Login
            </button>
            <button x-show="isAdmin" @click="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-md text-sm font-semibold transition">
                <i class="fa-solid fa-sign-out-alt mr-2"></i>Logout
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Summary Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-semibold mb-1">Saldo Kas Saat Ini</p>
                    <h3 class="text-3xl font-bold text-indigo-900" x-text="formatRp(saldo)">Rp 0</h3>
                </div>
                <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 text-xl">
                    <i class="fa-solid fa-building-columns"></i>
                </div>
            </div>
            <div class="glass p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-semibold mb-1">Total Pemasukan</p>
                    <h3 class="text-2xl font-bold text-green-600" x-text="formatRp(masuk)">Rp 0</h3>
                </div>
                <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-xl">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                </div>
            </div>
            <div class="glass p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-semibold mb-1">Total Pengeluaran</p>
                    <h3 class="text-2xl font-bold text-red-600" x-text="formatRp(keluar)">Rp 0</h3>
                </div>
                <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-red-600 text-xl">
                    <i class="fa-solid fa-arrow-trend-down"></i>
                </div>
            </div>
        </div>

        <!-- Admin Toolbar -->
        <div x-show="isAdmin" x-transition class="mb-6 flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-indigo-100">
            <div class="text-indigo-800 font-semibold"><i class="fa-solid fa-shield-halved mr-2"></i>Mode Administrator Aktif</div>
            <button @click="openFormModal('add')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-md transition">
                <i class="fa-solid fa-plus mr-2"></i>Catat Transaksi Baru
            </button>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full whitespace-nowrap">
                    <thead class="bg-gray-50 text-gray-600 text-xs uppercase font-semibold text-left">
                        <tr>
                            <th class="px-6 py-4 border-b">Tanggal</th>
                            <th class="px-6 py-4 border-b">Keterangan</th>
                            <th class="px-6 py-4 border-b text-center">Tipe</th>
                            <th class="px-6 py-4 border-b text-right">Nominal</th>
                            <th x-show="isAdmin" class="px-6 py-4 border-b text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm">
                        <template x-if="isLoading">
                            <tr><td colspan="5" class="px-6 py-10 text-center text-gray-400"><i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-indigo-500"></i><br>Sinkronisasi Data...</td></tr>
                        </template>
                        <template x-for="item in transactions" :key="item.id">
                            <tr class="hover:bg-gray-50 transition">
                                <td class="px-6 py-4 text-gray-500" x-text="item.tanggal"></td>
                                <td class="px-6 py-4 font-medium text-gray-900" x-text="item.keterangan"></td>
                                <td class="px-6 py-4 text-center">
                                    <span :class="item.tipe === 'Masuk' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'" class="px-3 py-1 rounded-full text-xs font-bold" x-text="item.tipe"></span>
                                </td>
                                <td class="px-6 py-4 text-right font-bold text-gray-700" x-text="formatRp(item.nominal)"></td>
                                <td x-show="isAdmin" class="px-6 py-4 text-center">
                                    <button @click="openFormModal('edit', item)" class="text-blue-500 hover:text-blue-700 mx-2 bg-blue-50 p-2 rounded-lg"><i class="fa-solid fa-pen"></i></button>
                                    <button @click="deleteData(item.id)" class="text-red-500 hover:text-red-700 mx-2 bg-red-50 p-2 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Login -->
    <div x-show="showLogin" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm" style="display: none;">
        <div @click.away="showLogin = false" class="bg-white rounded-xl shadow-2xl p-8 w-96 transform transition-all">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Otorisasi Admin</h2>
            <input type="text" x-model="loginData.user" placeholder="Username" class="w-full border-gray-300 rounded-lg shadow-sm p-3 mb-4 focus:ring-indigo-500 focus:border-indigo-500 bg-gray-50">
            <input type="password" x-model="loginData.pass" placeholder="Password" class="w-full border-gray-300 rounded-lg shadow-sm p-3 mb-6 focus:ring-indigo-500 focus:border-indigo-500 bg-gray-50">
            <button @click="login()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">
                Masuk Sistem
            </button>
        </div>
    </div>

    <!-- Modal Form Transaksi -->
    <div x-show="showForm" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm" style="display: none;">
        <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md">
            <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-3" x-text="formMode === 'add' ? 'Catat Transaksi Baru' : 'Edit Transaksi'"></h2>
            <div class="space-y-4">
                <div><label class="block text-sm font-semibold text-gray-600 mb-1">Tanggal</label>
                <input type="date" x-model="formData.tanggal" class="w-full border p-2.5 rounded-lg bg-gray-50"></div>
                <div><label class="block text-sm font-semibold text-gray-600 mb-1">Tipe Mutasi</label>
                <select x-model="formData.tipe" class="w-full border p-2.5 rounded-lg bg-gray-50">
                    <option value="Masuk">Pemasukan (Kredit)</option>
                    <option value="Keluar">Pengeluaran (Debit)</option>
                </select></div>
                <div><label class="block text-sm font-semibold text-gray-600 mb-1">Keterangan / Uraian</label>
                <input type="text" x-model="formData.keterangan" class="w-full border p-2.5 rounded-lg bg-gray-50" placeholder="Contoh: Iuran Warga Blok A"></div>
                <div><label class="block text-sm font-semibold text-gray-600 mb-1">Nominal (Rp)</label>
                <input type="number" x-model="formData.nominal" class="w-full border p-2.5 rounded-lg bg-gray-50" placeholder="Tanpa titik/koma"></div>
            </div>
            <div class="mt-8 flex justify-end gap-3">
                <button @click="showForm = false" class="px-5 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 font-semibold transition">Batal</button>
                <button @click="submitForm()" class="px-5 py-2.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 font-bold shadow-md transition">Simpan Data</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycby77uGoDCNX3ZTp74y-uZ_Vao_ZnPIdc6pS61j0ifkcXc8fMj-3aPR12V4ys7-tsuwiqA/exec'; // GANTI DENGAN URL WEB APP DEPLOYMENT BARU

        document.addEventListener('alpine:init', () => {
            Alpine.data('financeApp', () => ({
                transactions: [], saldo: 0, masuk: 0, keluar: 0,
                isLoading: true, isAdmin: false, showLogin: false, showForm: false, formMode: 'add',
                loginData: { user: '', pass: '' },
                formData: { id: '', tanggal: '', tipe: 'Masuk', keterangan: '', nominal: '' },

                formatRp(angka) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka); },

                async fetchData() {
                    this.isLoading = true;
                    try {
                        let res = await fetch(GAS_URL);
                        let data = await res.json();
                        this.transactions = data.data; this.saldo = data.saldo; this.masuk = data.masuk; this.keluar = data.keluar;
                    } catch (e) { Swal.fire('Koneksi Gagal', 'Gagal memuat data dari server.', 'error'); }
                    this.isLoading = false;
                },

                async apiPost(payload) {
                    Swal.fire({ title: 'Memproses...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                    try {
                        let res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                        let result = await res.json();
                        if(result.status === 'success') {
                            Swal.fire('Berhasil!', result.message, 'success');
                            this.fetchData(); return true;
                        } else { Swal.fire('Error', result.message, 'error'); return false; }
                    } catch (e) { Swal.fire('Error', 'Gagal menghubungi server.', 'error'); return false; }
                },

                async login() {
                    let success = await this.apiPost({ action: 'login', username: this.loginData.user, password: this.loginData.pass });
                    if(success) { this.isAdmin = true; this.showLogin = false; this.loginData.pass = ''; }
                },

                logout() { this.isAdmin = false; Swal.fire('Logout Berhasil', 'Sesi admin diakhiri', 'info'); },

                openFormModal(mode, item = null) {
                    this.formMode = mode;
                    if(mode === 'edit' && item) {
                        this.formData = { id: item.id, tanggal: item.tanggal, tipe: item.tipe, keterangan: item.keterangan, nominal: item.nominal };
                    } else {
                        let today = new Date().toISOString().split('T')[0];
                        this.formData = { id: '', tanggal: today, tipe: 'Masuk', keterangan: '', nominal: '' };
                    }
                    this.showForm = true;
                },

                async submitForm() {
                    if(!this.formData.keterangan || !this.formData.nominal) return Swal.fire('Peringatan', 'Lengkapi form!', 'warning');
                    let payload = { action: this.formMode, ...this.formData };
                    let success = await this.apiPost(payload);
                    if(success) this.showForm = false;
                },

                deleteData(id) {
                    Swal.fire({ title: 'Hapus Transaksi?', text: "Data ini tidak bisa dikembalikan!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6', confirmButtonText: 'Ya, Hapus!'
                    }).then(async (result) => {
                        if (result.isConfirmed) await this.apiPost({ action: 'delete', id: id });
                    });
                }
            }))
        })
    </script>
</body>
</html>
