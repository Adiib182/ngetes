<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Warga</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    label { font-weight: bold; font-size: 14px; display: block; margin-top: 15px; }
    input, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; }
    button { background-color: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 15px; }
    button:hover { background-color: #45a049; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; }
  </style>
</head>
<body>

  <h3 style="text-align: center;">Form Data Warga</h3>
  
  <label for="noBlokInput">Nomor Blok / Rumah:</label>
  <input type="text" id="noBlokInput" placeholder="Contoh: Blok A No. 12" required>

  <label for="fileInput">Upload File / Foto Kartu Keluarga:</label>
  <input type="file" id="fileInput" accept="image/*, application/pdf" required>
  <p style="font-size: 11px; color: gray; margin-top: 2px;">*Format didukung: JPG, PNG, WEBP, PDF.</p>
  
  <button id="submitBtn" onclick="uploadFile()">Kirim & Ekstrak Data</button>
  
  <div id="status"></div>

  <script>
    // MASUKKAN URL APLIKASI WEB GAS KAMU DI SINI
    const GAS_WEB_APP_URL = "URL_GAS_KAMU_PASTE_DI_SINI";

    function uploadFile() {
      var noBlok = document.getElementById('noBlokInput').value;
      var fileInput = document.getElementById('fileInput');
      var file = fileInput.files[0];
      var statusDiv = document.getElementById('status');
      var btn = document.getElementById('submitBtn');

      if (noBlok.trim() === "") {
        statusDiv.innerText = "❌ Mohon isi Nomor Blok/Rumah!";
        statusDiv.style.color = "red";
        return;
      }
      
      if (!file) {
        statusDiv.innerText = "❌ Mohon pilih file/foto KK!";
        statusDiv.style.color = "red";
        return;
      }

      statusDiv.innerText = "⏳ Sedang memproses dokumen... (Bisa butuh 10-20 detik)";
      statusDiv.style.color = "blue";
      btn.disabled = true; // Matikan tombol sementara biar nggak diklik 2x
      btn.innerText = "Memproses...";

      var reader = new FileReader();
      reader.onloadend = async function() {
        var base64Data = reader.result;
        
        var payload = {
          base64: base64Data,
          mimeType: file.type,
          noBlok: noBlok
        };

        try {
          // Mengirim data ke GAS API menggunakan fetch
          // Kita pakai text/plain untuk menghindari isu CORS Preflight bawaan Google
          let response = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain' 
            },
            body: JSON.stringify(payload)
          });
          
          let result = await response.json();

          if(result.status === "success") {
            statusDiv.innerText = "✅ " + result.message;
            statusDiv.style.color = "green";
            fileInput.value = ""; 
            document.getElementById('noBlokInput').value = ""; 
          } else {
            statusDiv.innerText = "❌ Gagal: " + result.message;
            statusDiv.style.color = "red";
          }
        } catch (error) {
          statusDiv.innerText = "❌ Terjadi kendala jaringan: " + error.message;
          statusDiv.style.color = "red";
        } finally {
          btn.disabled = false;
          btn.innerText = "Kirim & Ekstrak Data";
        }
      };
      
      reader.readAsDataURL(file);
    }
  </script>

</body>
</html>
