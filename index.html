<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas Cluster Titik Pulang Sawangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Transparansi Kas Cluster</h1>
            <!-- Tombol Login Admin -->
            <button onclick="toggleAdminLogin()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 text-sm">
                Login Admin
            </button>
        </div>

        <!-- Ringkasan Saldo -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-6 rounded-lg shadow border-t-4 border-blue-500">
                <h3 class="text-gray-500 text-sm font-semibold">Saldo Akhir</h3>
                <p class="text-2xl font-bold text-gray-800" id="saldoAkhir">Loading...</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-t-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-semibold">Total Pemasukan</h3>
                <p class="text-2xl font-bold text-green-600" id="totalMasuk">Loading...</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-t-4 border-red-500">
                <h3 class="text-gray-500 text-sm font-semibold">Total Pengeluaran</h3>
                <p class="text-2xl font-bold text-red-600" id="totalKeluar">Loading...</p>
            </div>
        </div>

        <!-- Area Admin (Disembunyikan secara default) -->
        <div id="adminPanel" class="bg-white p-6 rounded-lg shadow mb-8 hidden">
            <h2 class="text-xl font-bold mb-4">Panel Admin - Input Transaksi</h2>
            <form id="formTransaksi" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="date" id="inputTanggal" class="border p-2 rounded" required>
                <select id="inputTipe" class="border p-2 rounded" required>
                    <option value="Masuk">Pemasukan</option>
                    <option value="Keluar">Pengeluaran</option>
                </select>
                <input type="text" id="inputKeterangan" placeholder="Keterangan..." class="border p-2 rounded" required>
                <input type="number" id="inputNominal" placeholder="Nominal (Tanpa Titik)" class="border p-2 rounded" required>
                <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded md:col-span-4 font-bold">Simpan Transaksi</button>
            </form>
        </div>

        <!-- Tabel Riwayat Transaksi -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-white">
                        <th class="p-3">Tanggal</th>
                        <th class="p-3">Keterangan</th>
                        <th class="p-3">Tipe</th>
                        <th class="p-3 text-right">Nominal</th>
                        <!-- Kolom Aksi akan dimunculkan lewat JS saat admin login -->
                        <th class="p-3 text-center admin-action hidden">Aksi</th> 
                    </tr>
                </thead>
                <tbody id="tabelTransaksi">
                    <tr><td colspan="4" class="p-4 text-center text-gray-500">Memuat data dari server...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // TARUH URL WEB APP GOOGLE APPS SCRIPT DI SINI
        const GAS_URL = 'https://script.google.com/macros/s/AKfycby77uGoDCNX3ZTp74y-uZ_Vao_ZnPIdc6pS61j0ifkcXc8fMj-3aPR12V4ys7-tsuwiqA/exec'; 
        let isAdmin = false;

        // Fungsi format Rupiah
        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(angka);

        // Fungsi mengambil data untuk Dashboard
        async function loadData() {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                
                if(data.status === 'success') {
                    document.getElementById('saldoAkhir').innerText = formatRp(data.saldo_akhir);
                    document.getElementById('totalMasuk').innerText = formatRp(data.total_masuk);
                    document.getElementById('totalKeluar').innerText = formatRp(data.total_keluar);
                    
                    let tabelHtml = '';
                    data.data.forEach(row => {
                        let warnaTipe = row.tipe === 'Masuk' ? 'text-green-600 font-bold' : 'text-red-600 font-bold';
                        tabelHtml += `
                            <tr class="border-b">
                                <td class="p-3">${row.tanggal}</td>
                                <td class="p-3">${row.keterangan}</td>
                                <td class="p-3 ${warnaTipe}">${row.tipe}</td>
                                <td class="p-3 text-right">${formatRp(row.nominal)}</td>
                                ${isAdmin ? `<td class="p-3 text-center"><button class="text-blue-500 mr-2">Edit</button> <button class="text-red-500">Hapus</button></td>` : ''}
                            </tr>
                        `;
                    });
                    document.getElementById('tabelTransaksi').innerHTML = tabelHtml;
                }
            } catch (error) {
                console.error("Gagal mengambil data", error);
                document.getElementById('tabelTransaksi').innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500">Gagal memuat data.</td></tr>';
            }
        }

        // Fungsi sederhana memunculkan form admin
        function toggleAdminLogin() {
            const pass = prompt("Masukkan password Admin:");
            // Ini versi sangat sederhana untuk UI. Logika login sebenarnya divalidasi ke backend.
            if (pass === "123456") { 
                isAdmin = true;
                document.getElementById('adminPanel').classList.remove('hidden');
                loadData(); // Reload tabel untuk memunculkan tombol Edit/Hapus
                alert("Login berhasil!");
            } else {
                alert("Password salah!");
            }
        }

        // Panggil data saat web pertama dibuka
        loadData();
    </script>
</body>
</html>
