<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Keuangan Cluster Titik Pulang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body x-data="financeApp()" x-init="fetchData()" class="text-gray-800">

    <nav class="bg-indigo-900 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-wallet text-2xl text-indigo-400"></i>
                <span class="font-bold text-xl tracking-tight">Titik Pulang Finance</span>
            </div>
            <button x-show="!isAdmin" @click="showLogin = true" class="bg-indigo-700 hover:bg-indigo-600 px-4 py-2 rounded-md text-sm font-semibold transition">
                <i class="fa-solid fa-lock mr-2"></i>Admin Login
            </button>
            <button x-show="isAdmin" @click="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-md text-sm font-semibold transition">
                <i class="fa-solid fa-sign-out-alt mr-2"></i>Logout
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-3 md:mb-0">Ringkasan Laporan Kas</h2>
            
            <div class="flex items-center bg-white border border-gray-200 rounded-lg shadow-sm px-4 py-2 cursor-pointer hover:border-indigo-300 transition">
                <i class="fa-solid fa-calendar-days text-indigo-500 mr-3"></i>
                <!-- Saat ganti bulan, kembalikan ke halaman 1 -->
                <select x-model="selectedPeriode" @change="currentPage = 1; fetchData()" class="bg-transparent text-sm font-semibold text-gray-700 outline-none cursor-pointer pr-4 appearance-none">
                    <option value="Semua">Semua Riwayat Waktu</option>
                    <template x-for="p in listPeriode" :key="p">
                        <option :value="p" x-text="formatNamaBulan(p)"></option>
                    </template>
                </select>
                <i class="fa-solid fa-chevron-down text-gray-400 text-xs pointer-events-none"></i>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-semibold mb-1">Saldo Kas Saat Ini</p>
                    <h3 class="text-3xl font-bold text-indigo-900" x-text="formatRp(saldo)">Rp 0</h3>
                </div>
                <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 text-xl"><i class="fa-solid fa-building-columns"></i></div>
            </div>
            <div class="glass p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-semibold mb-1" x-text="'Masuk (' + formatNamaBulan(selectedPeriode) + ')'"></p>
                    <h3 class="text-2xl font-bold text-green-600" x-text="formatRp(masuk)">Rp 0</h3>
                </div>
                <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-xl"><i class="fa-solid fa-arrow-trend-up"></i></div>
            </div>
            <div class="glass p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-semibold mb-1" x-text="'Keluar (' + formatNamaBulan(selectedPeriode) + ')'"></p>
                    <h3 class="text-2xl font-bold text-red-600" x-text="formatRp(keluar)">Rp 0</h3>
                </div>
                <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-red-600 text-xl"><i class="fa-solid fa-arrow-trend-down"></i></div>
            </div>
        </div>

        <div x-show="isAdmin" x-transition class="mb-6 flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-indigo-100">
            <div class="text-indigo-800 font-semibold"><i class="fa-solid fa-shield-halved mr-2"></i>Mode Administrator Aktif</div>
            <button @click="openFormModal('add')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-md transition">
                <i class="fa-solid fa-plus mr-2"></i>Catat Transaksi Baru
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full whitespace-nowrap">
                    <thead class="bg-gray-50 text-gray-600 text-xs uppercase font-semibold text-left">
                        <tr>
                            <th class="px-6 py-4 border-b">Tanggal</th>
                            <th class="px-6 py-4 border-b">Keterangan</th>
                            <th class="px-6 py-4 border-b text-center">Tipe</th>
                            <th class="px-6 py-4 border-b text-right">Nominal</th>
                            <th x-show="isAdmin" class="px-6 py-4 border-b text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm">
                        <template x-if="isLoading">
                            <tr><td colspan="5" class="px-6 py-10 text-center text-gray-400"><i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-indigo-500"></i><br>Menyaring Data...</td></tr>
                        </template>
                        <template x-if="!isLoading && transactions.length === 0">
                            <tr><td colspan="5" class="px-6 py-10 text-center text-gray-400">Tidak ada transaksi di periode ini.</td></tr>
                        </template>
                        <template x-for="item in transactions" :key="item.id">
                            <tr class="hover:bg-gray-50 transition">
                                <td class="px-6 py-4 text-gray-500 font-medium" x-text="item.tanggal"></td>
                                <td class="px-6 py-4 font-medium text-gray-900" x-text="item.keterangan"></td>
                                <td class="px-6 py-4 text-center">
                                    <span :class="item.tipe === 'Masuk' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'" class="px-3 py-1 rounded-full text-xs font-bold" x-text="item.tipe"></span>
                                </td>
                                <td class="px-6 py-4 text-right font-bold text-gray-700" x-text="formatRp(item.nominal)"></td>
                                <td x-show="isAdmin" class="px-6 py-4 text-center">
                                    <button @click="openFormModal('edit', item)" class="text-blue-500 hover:text-blue-700 mx-2 bg-blue-50 p-2 rounded-lg"><i class="fa-solid fa-pen"></i></button>
                                    <button @click="deleteData(item.id)" class="text-red-500 hover:text-red-700 mx-2 bg-red-50 p-2 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- CONTROLS PAGINATION -->
            <div x-show="totalPages > 1 && !isLoading" class="bg-gray-50 px-6 py-4 border-t flex items-center justify-between">
                <span class="text-sm text-gray-600">
                    Menampilkan Halaman <span class="font-bold" x-text="currentPage"></span> dari <span class="font-bold" x-text="totalPages"></span> 
                    (Total: <span x-text="totalItems"></span> transaksi)
                </span>
                <div class="flex gap-2">
                    <button @click="gantiHalaman(currentPage - 1)" :disabled="currentPage === 1" 
                            class="px-4 py-2 border rounded-md text-sm font-semibold transition"
                            :class="currentPage === 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white text-indigo-600 hover:bg-indigo-50 border-indigo-200'">
                        <i class="fa-solid fa-chevron-left mr-1"></i> Prev
                    </button>
                    <button @click="gantiHalaman(currentPage + 1)" :disabled="currentPage === totalPages" 
                            class="px-4 py-2 border rounded-md text-sm font-semibold transition"
                            :class="currentPage === totalPages ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white text-indigo-600 hover:bg-indigo-50 border-indigo-200'">
                        Next <i class="fa-solid fa-chevron-right ml-1"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Login -->
    <div x-show="showLogin" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm" style="display: none;">
        <div @click.away="showLogin = false" class="bg-white rounded-xl shadow-2xl p-8 w-96">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Otorisasi Admin</h2>
            <input type="text" x-model="loginData.user" placeholder="Username" class="w-full border-gray-300 rounded-lg shadow-sm p-3 mb-4 focus:ring-indigo-500 bg-gray-50">
            <input type="password" x-model="loginData.pass" placeholder="Password" class="w-full border-gray-300 rounded-lg shadow-sm p-3 mb-6 focus:ring-indigo-500 bg-gray-50">
            <button @click="login()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">Masuk Sistem</button>
        </div>
    </div>

    <!-- Modal Form -->
    <div x-show="showForm" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm" style="display: none;">
        <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md">
            <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-3" x-text="formMode === 'add' ? 'Catat Transaksi Baru' : 'Edit Transaksi'"></h2>
            <div class="space-y-4">
                <div><label class="block text-sm font-semibold text-gray-600 mb-1">Tanggal</label>
                <input type="date" x-model="formData.tanggal" class="w-full border p-2.5 rounded-lg bg-gray-50"></div>
                <div><label class="block text-sm font-semibold text-gray-600 mb-1">Tipe Mutasi</label>
                <select x-model="formData.tipe" class="w-full border p-2.5 rounded-lg bg-gray-50">
                    <option value="Masuk">Pemasukan (Kredit)</option>
                    <option value="Keluar">Pengeluaran (Debit)</option>
                </select></div>
                <div><label class="block text-sm font-semibold text-gray-600 mb-1">Keterangan / Uraian</label>
                <input type="text" x-model="formData.keterangan" class="w-full border p-2.5 rounded-lg bg-gray-50" placeholder="Contoh: Iuran Warga Blok A"></div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Nominal (Rp)</label>
                    <!-- Input text untuk tampilan format ribuan (1.500.000) -->
                    <input type="text" x-model="displayNominal" @input="formatInputNominal()" class="w-full border p-2.5 rounded-lg bg-gray-50 font-bold" placeholder="Contoh: 150.000">
                </div>
            </div>
            <div class="mt-8 flex justify-end gap-3">
                <button @click="showForm = false" class="px-5 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 font-semibold transition">Batal</button>
                <button @click="submitForm()" class="px-5 py-2.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 font-bold shadow-md transition">Simpan Data</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycby77uGoDCNX3ZTp74y-uZ_Vao_ZnPIdc6pS61j0ifkcXc8fMj-3aPR12V4ys7-tsuwiqA/exec'; // GANTI DENGAN URL DEPLOYMENT BARU

        document.addEventListener('alpine:init', () => {
            Alpine.data('financeApp', () => ({
                transactions: [], saldo: 0, masuk: 0, keluar: 0,
                listPeriode: [], selectedPeriode: 'Semua', 
                
                // Variabel untuk Pagination
                currentPage: 1, totalPages: 1, totalItems: 0,
                
                isLoading: true, isAdmin: false, showLogin: false, showForm: false, formMode: 'add',
                loginData: { user: '', pass: '' },
                formData: { id: '', tanggal: '', tipe: 'Masuk', keterangan: '', nominal: 0 },
                displayNominal: '', // Untuk tampilan input admin (1.500.000)

                formatRp(angka) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka); },
                
                formatNamaBulan(yyyyMm) {
                    if(!yyyyMm || yyyyMm === 'Semua') return 'Semua Riwayat';
                    const [year, month] = yyyyMm.split('-');
                    const bulanIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                    return `${bulanIndo[parseInt(month, 10) - 1]} ${year}`;
                },

                // Logika Pemisah Ribuan Saat Admin Mengetik
                formatInputNominal() {
                    // Hilangkan semua karakter selain angka
                    let rawValue = this.displayNominal.replace(/[^0-9]/g, '');
                    if (!rawValue) {
                        this.displayNominal = '';
                        this.formData.nominal = 0;
                        return;
                    }
                    // Simpan angka murni ke formData untuk dikirim ke database
                    this.formData.nominal = parseInt(rawValue, 10);
                    // Tampilkan format ribuan dengan titik (contoh: 1.500.000)
                    this.displayNominal = new Intl.NumberFormat('id-ID').format(this.formData.nominal);
                },

                async fetchData() {
                    this.isLoading = true;
                    this.transactions = []; 
                    try {
                        // Kirim periode dan nomor halaman ke GAS
                        let res = await fetch(`${GAS_URL}?periode=${this.selectedPeriode}&page=${this.currentPage}`);
                        let data = await res.json();
                        
                        this.transactions = data.data; 
                        this.saldo = data.saldo; 
                        this.masuk = data.masuk; 
                        this.keluar = data.keluar;
                        this.listPeriode = data.list_periode;
                        
                        // Set data pagination dari backend
                        this.currentPage = data.pagination.currentPage;
                        this.totalPages = data.pagination.totalPages;
                        this.totalItems = data.pagination.totalItems;

                        if (this.selectedPeriode === 'Semua' && this.listPeriode.length > 0 && !this.initialLoadDone) {
                            this.selectedPeriode = this.listPeriode[0];
                            this.initialLoadDone = true;
                            this.currentPage = 1; // Paksa ke halaman 1 saat awal ganti bulan
                            this.fetchData(); 
                            return;
                        }
                    } catch (e) { Swal.fire('Koneksi Gagal', 'Gagal memuat data.', 'error'); }
                    this.isLoading = false;
                },

                gantiHalaman(newPage) {
                    if (newPage >= 1 && newPage <= this.totalPages) {
                        this.currentPage = newPage;
                        this.fetchData();
                    }
                },

                async apiPost(payload) {
                    Swal.fire({ title: 'Memproses...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                    try {
                        let res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                        let result = await res.json();
                        if(result.status === 'success') {
                            Swal.fire('Berhasil!', result.message, 'success');
                            this.fetchData(); return true;
                        } else { Swal.fire('Error', result.message, 'error'); return false; }
                    } catch (e) { Swal.fire('Error', 'Gagal menghubungi server.', 'error'); return false; }
                },

                async login() {
                    let success = await this.apiPost({ action: 'login', username: this.loginData.user, password: this.loginData.pass });
                    if(success) { this.isAdmin = true; this.showLogin = false; this.loginData.pass = ''; }
                },

                logout() { this.isAdmin = false; this.currentPage = 1; this.fetchData(); Swal.fire('Logout Berhasil', 'Sesi admin diakhiri', 'info'); },

                openFormModal(mode, item = null) {
                    this.formMode = mode;
                    if(mode === 'edit' && item) {
                        this.formData = { id: item.id, tanggal: item.rawTanggal, tipe: item.tipe, keterangan: item.keterangan, nominal: item.nominal };
                        // Format untuk tampilan saat modal edit dibuka
                        this.displayNominal = new Intl.NumberFormat('id-ID').format(item.nominal);
                    } else {
                        let today = new Date().toISOString().split('T')[0];
                        this.formData = { id: '', tanggal: today, tipe: 'Masuk', keterangan: '', nominal: 0 };
                        this.displayNominal = '';
                    }
                    this.showForm = true;
                },

                async submitForm() {
                    if(!this.formData.keterangan || this.formData.nominal <= 0) return Swal.fire('Peringatan', 'Lengkapi form dan pastikan nominal lebih dari 0!', 'warning');
                    let success = await this.apiPost({ action: this.formMode, ...this.formData });
                    if(success) { this.showForm = false; }
                },

                deleteData(id) {
                    Swal.fire({ title: 'Hapus Transaksi?', text: "Data ini tidak bisa dikembalikan!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6', confirmButtonText: 'Ya, Hapus!'
                    }).then(async (result) => {
                        if (result.isConfirmed) await this.apiPost({ action: 'delete', id: id });
                    });
                }
            }))
        })
    </script>
</body>
</html>
